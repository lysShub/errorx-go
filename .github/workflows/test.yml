name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go fmt ./...
      - run: go test ./...
      - run: go test -tags debug ./...
      - run: git diff --exit-code

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go test ./...
      - run: go test -tags debug ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  checks-done:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.lint.result }}" = success
      - run: test "${{ needs.test.result }}" = success
